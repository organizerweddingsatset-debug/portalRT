    <rect x="15" y="100" width="20" height="35" fill="#0f172a" />
    <rect x="45" y="110" width="45" height="15" fill="#0f172a" />
    <rect x="100" y="100" width="15" height="40" fill="#0f172a" />
    <rect x="125" y="105" width="35" height="15" fill="#0f172a" />
